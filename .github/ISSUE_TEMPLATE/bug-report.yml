name: Bug Report
description: Report a defect found during testing
labels: ["bug"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: One-line description of the defect
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P1 - Critical, P2 - High, P3 - Medium, P4 - Low]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, tool version
