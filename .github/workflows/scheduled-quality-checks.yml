name: Scheduled Quality Checks

on:
  schedule:
    # Runs at 07:00 UTC on weekdays — responsible frequency, not hammering public systems
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  accessibility-check:
    name: Accessibility Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @accessibility
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: accessibility/reports/
          retention-days: 30
