name: Playwright Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-chromium:
    name: Playwright — Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-chromium-results
          path: playwright/reports/
          retention-days: 14

  playwright-cross-browser:
    name: Playwright — Cross-browser
    runs-on: ubuntu-latest
    needs: playwright-chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=firefox --project=webkit
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-cross-browser-results
          path: playwright/reports/
          retention-days: 14
